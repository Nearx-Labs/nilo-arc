name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nearx-labs/nilo-arc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      # Only VITE_ARC_NETWORK is needed at build time (Vite inlines it into the web bundle).
      # OPENAI_API_KEY, OPENAI_MODEL, ARC_NETWORK and NILO_OPERATOR_KEY are read at runtime from the server's .env.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_ARC_NETWORK=${{ vars.ARC_NETWORK || 'testnet' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pulls the new :latest on the server and restarts only the nilo-arc service (Traefik is left alone).
  # The server must already be able to pull from GHCR (docker login there, or a public package).
  # Skipped until the repo has the SSH_* secrets, so a fork or a fresh clone still builds green.
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      HAS_SERVER: ${{ secrets.SSH_HOST != '' }}
    steps:
      - if: env.HAS_SERVER != 'true'
        run: echo "No SSH_HOST secret, so there is no server to deploy to."
      - if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd /etc/nearx
            sudo docker compose pull nilo-arc
            sudo docker compose up -d nilo-arc
            sudo docker image prune -f
